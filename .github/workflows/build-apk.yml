name: Android APK Derle
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Proje Dosyalarini Olustur
        run: |
          mkdir -p app/src/main/java/com/sakkamera/app app/src/main/res/layout
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SakKamera"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.sakkamera.app"
              compileSdk = 34
              defaultConfig { applicationId = "com.sakkamera.app"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val cx = "1.3.3"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$cx")
              implementation("androidx.camera:camera-camera2:$cx")
              implementation("androidx.camera:camera-lifecycle:$cx")
              implementation("androidx.camera:camera-view:$cx")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
              implementation("com.google.android.gms:play-services-location:21.3.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application android:allowBackup="true" android:label="ŞakKamera" android:supportsRtl="true" android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000000">
              <androidx.camera.view.PreviewView android:id="@+id/viewFinder" android:layout_width="match_parent" android:layout_height="match_parent" />
              <TextView android:id="@+id/tvFolderStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="top" android:background="#990F172A" android:padding="14dp" android:text="Aktif Klasör: Hedef_Konum_Fotolari" android:textColor="#34D399" android:textSize="15sp" android:textStyle="bold" />
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="bottom" android:background="#CC0F172A" android:gravity="center" android:orientation="horizontal" android:padding="18dp">
                  <Button android:id="@+id/btnSetLocation" android:layout_width="0dp" android:layout_height="56dp" android:layout_weight="1" android:text="Konum Seç" android:textSize="12sp" />
                  <Button android:id="@+id/btnShot" android:layout_width="96dp" android:layout_height="96dp" android:layout_marginStart="16dp" android:layout_marginEnd="16dp" android:backgroundTint="#10B981" android:text="SHOT" android:textColor="#020617" android:textSize="16sp" android:textStyle="bold" />
                  <Button android:id="@+id/btnGallery" android:layout_width="0dp" android:layout_height="56dp" android:layout_weight="1" android:text="Fotoğraflar" android:textSize="12sp" />
              </LinearLayout>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/sakkamera/app/EndOfDayCleanupWorker.kt
          package com.sakkamera.app
          import android.content.Context
          import android.os.Environment
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import java.io.File
          class EndOfDayCleanupWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result { deleteTargetOnly(applicationContext); return Result.success() }
              companion object {
                  const val TARGET_FOLDER = "Hedef_Konum_Fotolari"
                  const val NORMAL_FOLDER = "Genel_Galeri"
                  fun deleteTargetOnly(ctx: Context): Int {
                      val dir = File(ctx.getExternalFilesDir(Environment.DIRECTORY_PICTURES), TARGET_FOLDER)
                      var c = 0
                      dir.listFiles()?.forEach { if (it.isFile && it.delete()) c++ }
                      return c
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/sakkamera/app/MainActivity.kt
          package com.sakkamera.app
          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.pm.PackageManager
          import android.location.Location
          import android.os.*
          import android.widget.*
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.work.*
          import com.google.android.gms.location.LocationServices
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity() {
              private lateinit var viewFinder: PreviewView
              private lateinit var tvFolderStatus: TextView
              private var imageCapture: ImageCapture? = null
              private var autoDone = false
              private var lastLoc: Location? = null
              private val fused by lazy { LocationServices.getFusedLocationProviderClient(this) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  viewFinder = findViewById(R.id.viewFinder)
                  tvFolderStatus = findViewById(R.id.tvFolderStatus)
                  checkRollover(); scheduleCleanup()
                  findViewById<Button>(R.id.btnShot).setOnClickListener { takePhoto() }
                  findViewById<Button>(R.id.btnGallery).setOnClickListener { showGallery() }
                  findViewById<Button>(R.id.btnSetLocation).setOnClickListener { saveTargetLoc() }
                  if (permsGranted()) initCam() else ActivityCompat.requestPermissions(this, PERMS, 10)
              }

              @SuppressLint("MissingPermission")
              private fun initCam() {
                  fused.lastLocation.addOnSuccessListener { lastLoc = it; updateBanner(); startCamera() }.addOnFailureListener { startCamera() }
              }

              private fun startCamera() {
                  val fut = ProcessCameraProvider.getInstance(this)
                  fut.addListener({
                      val prov = fut.get()
                      val prev = Preview.Builder().build().also { it.setSurfaceProvider(viewFinder.surfaceProvider) }
                      imageCapture = ImageCapture.Builder().setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY).build()
                      prov.unbindAll()
                      prov.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, prev, imageCapture)
                      if (!autoDone) { autoDone = true; Handler(Looper.getMainLooper()).postDelayed({ takePhoto() }, 450) }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun inTarget(): Boolean {
                  val p = getSharedPreferences("sak", Context.MODE_PRIVATE)
                  if (!p.contains("lat")) return true
                  val cur = lastLoc ?: return true
                  val res = FloatArray(1)
                  Location.distanceBetween(cur.latitude, cur.longitude, p.getFloat("lat", 0f).toDouble(), p.getFloat("lng", 0f).toDouble(), res)
                  return res[0] <= 150f
              }

              private fun activeDir(): File {
                  val name = if (inTarget()) EndOfDayCleanupWorker.TARGET_FOLDER else EndOfDayCleanupWorker.NORMAL_FOLDER
                  return File(getExternalFilesDir(Environment.DIRECTORY_PICTURES), name).apply { mkdirs() }
              }

              private fun updateBanner() { tvFolderStatus.text = "Aktif Klasör: ${activeDir().name}" }

              private fun takePhoto() {
                  val cap = imageCapture ?: return
                  val dir = activeDir()
                  val f = File(dir, "SAK_${SimpleDateFormat("yyyyMMdd_HHmmss_SSS", Locale.US).format(Date())}.jpg")
                  cap.takePicture(ImageCapture.OutputFileOptions.Builder(f).build(), ContextCompat.getMainExecutor(this), object : ImageCapture.OnImageSavedCallback {
                      override fun onError(e: ImageCaptureException) {}
                      override fun onImageSaved(r: ImageCapture.OutputFileResults) {
                          updateBanner()
                          Toast.makeText(baseContext, "Kaydedildi: ${dir.name}", Toast.LENGTH_SHORT).show()
                      }
                  })
              }

              @SuppressLint("MissingPermission")
              private fun saveTargetLoc() {
                  fused.lastLocation.addOnSuccessListener {
                      if (it != null) {
                          lastLoc = it
                          getSharedPreferences("sak", Context.MODE_PRIVATE).edit().putFloat("lat", it.latitude.toFloat()).putFloat("lng", it.longitude.toFloat()).apply()
                          updateBanner()
                          Toast.makeText(this, "Hedef konum kaydedildi (150m)", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun showGallery() {
                  val b = getExternalFilesDir(Environment.DIRECTORY_PICTURES)
                  val t = File(b, EndOfDayCleanupWorker.TARGET_FOLDER).listFiles()?.size ?: 0
                  val n = File(b, EndOfDayCleanupWorker.NORMAL_FOLDER).listFiles()?.size ?: 0
                  AlertDialog.Builder(this).setTitle("Klasörler").setMessage("Hedef Klasör (Gün Sonu Silinir): $t fotoğraf\nGenel Galeri (Kalıcı): $n fotoğraf")
                      .setPositiveButton("Tamam", null)
                      .setNeutralButton("Gün Sonu Silmeyi Test Et") { _, _ ->
                          val d = EndOfDayCleanupWorker.deleteTargetOnly(this)
                          Toast.makeText(this, "$d fotoğraf silindi", Toast.LENGTH_SHORT).show()
                      }.show()
              }

              private fun checkRollover() {
                  val p = getSharedPreferences("sak", Context.MODE_PRIVATE)
                  val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  if (p.getString("day", today) != today) EndOfDayCleanupWorker.deleteTargetOnly(this)
                  p.edit().putString("day", today).apply()
              }

              private fun scheduleCleanup() {
                  val req = PeriodicWorkRequestBuilder<EndOfDayCleanupWorker>(24, TimeUnit.HOURS).build()
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork("eod", ExistingPeriodicWorkPolicy.KEEP, req)
              }

              private fun permsGranted() = PERMS.all { ContextCompat.checkSelfPermission(baseContext, it) == PackageManager.PERMISSION_GRANTED }
              override fun onRequestPermissionsResult(c: Int, p: Array<String>, g: IntArray) { super.onRequestPermissionsResult(c, p, g); if (permsGranted()) initCam() }
              companion object { val PERMS = arrayOf(Manifest.permission.CAMERA, Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION) }
          }
          EOF

      - name: Gradle Kur ve APK Derle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: SakKamera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
